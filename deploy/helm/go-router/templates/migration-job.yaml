{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "go-router.fullname" . }}-migrate
  labels:
    {{- include "go-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "go-router.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migrations.serviceAccountName }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cloudSqlProxy.enabled }}
      # A native sidecar (Kubernetes 1.29+) starts before the migrator and is
      # stopped automatically when the main container exits.
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: "{{ .Values.cloudSqlProxy.image.repository }}:{{ .Values.cloudSqlProxy.image.tag }}"
          imagePullPolicy: {{ .Values.cloudSqlProxy.image.pullPolicy }}
          {{- with .Values.cloudSqlProxy.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if .Values.cloudSqlProxy.args }}
            {{- toYaml .Values.cloudSqlProxy.args | nindent 12 }}
            {{- else }}
            {{- include "go-router.cloudSqlProxyArgs" . | nindent 12 }}
            {{- end }}
          # Native sidecars block subsequent init/main containers until their
          # startup probe succeeds, avoiding a proxy/migrator startup race.
          startupProbe:
            httpGet:
              path: /startup
              port: {{ .Values.cloudSqlProxy.healthPort }}
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.cloudSqlProxy.healthPort }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.cloudSqlProxy.healthPort }}
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cloudSqlProxy.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "go-router.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              {{ if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-router.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
              {{ else }}
              value: {{ required "database.url is required" .Values.database.url | quote }}
              {{ end }}
            - name: MIGRATION_DATABASE_URL
              {{ if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-router.databaseSecretName" . }}
                  key: {{ .Values.database.migrationExistingSecretKey }}
              {{ else }}
              value: {{ default .Values.database.url .Values.database.migrationUrl | quote }}
              {{ end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
