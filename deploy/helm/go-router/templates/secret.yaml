{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "database.existingSecret or database.url is required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-router.databaseSecretName" . }}
  labels:
    {{- include "go-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{ .Values.database.migrationExistingSecretKey }}: {{ default .Values.database.url .Values.database.migrationUrl | quote }}
{{- end }}
